<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión | SinoChat</title>
    <style>
      :root {
        color: #f5f2eb;
        background: #080808;
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 1rem;
        place-items: center;
        background:
          radial-gradient(circle at 15% 20%, rgba(200, 16, 46, 0.18), transparent 26rem),
          radial-gradient(circle at 88% 80%, rgba(212, 175, 55, 0.11), transparent 24rem),
          #080808;
      }

      main {
        width: min(440px, 100%);
        padding: clamp(1.4rem, 5vw, 2.3rem);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1rem;
        background: rgba(21, 21, 21, 0.96);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
        text-align: center;
      }

      img {
        display: block;
        width: 72px;
        height: 72px;
        margin: 0 auto 1.25rem;
        border-radius: 1rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.55rem, 7vw, 2rem);
        letter-spacing: -0.045em;
      }

      p {
        margin: 0.75rem 0 0;
        color: #9b9891;
        font-size: 0.86rem;
        line-height: 1.65;
      }

      .privacy {
        margin-top: 1rem;
        color: #716f69;
        font-size: 0.7rem;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        margin-top: 1.35rem;
        padding: 0.75rem 1rem;
        align-items: center;
        justify-content: center;
        border-radius: 0.65rem;
        color: #171307;
        background: linear-gradient(135deg, #f0cf60, #d4af37);
        font-size: 0.8rem;
        font-weight: 800;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid rgba(240, 207, 96, 0.55);
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/pwa-icon-192.png" alt="" />
      <h1>Estás sin conexión</h1>
      <p>
        SinoChat necesita conectarse para verificar tu sesión y recibir mensajes
        vigentes. Revisa tu conexión e inténtalo nuevamente.
      </p>
      <p class="privacy">
        Por privacidad, los chats, fotos y respuestas autenticadas no se guardan en
        la caché de la aplicación.
      </p>
      <a href="">Reintentar conexión</a>
    </main>
  </body>
</html>
