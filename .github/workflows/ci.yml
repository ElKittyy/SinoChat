name: Verificación

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sinochat_ci
          POSTGRES_PASSWORD: sinochat_ci
          POSTGRES_USER: sinochat_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sinochat_ci -d sinochat_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://sinochat_ci:sinochat_ci@localhost:5432/sinochat_ci
      NODE_ENV: test

    steps:
      - name: Obtener código
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
          package-manager-cache: true

      - name: Preparar npm con soporte correcto de overrides en workspaces
        run: npm install --global npm@11.19.1 --ignore-scripts

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Auditar dependencias
        run: npm audit --audit-level=high

      - name: Validar Prisma
        run: npm run db:validate --workspace @sinochat/api

      - name: Probar migraciones en PostgreSQL limpio
        run: npm run db:deploy --workspace @sinochat/api

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Instalar Chromium fijado para las pruebas reales de navegador
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Ejecutar pruebas
        run: npm test

      - name: Validar cliente cifrado en contextos de navegador aislados
        run: npm run check:e2ee-browser

      - name: Construir artefactos
        run: npm run build

      - name: Validar restricciones Matrix en PostgreSQL
        run: npm run check:matrix-db

      - name: Validar identidad inicial y concurrencia en PostgreSQL aislado
        run: npm run check:cross-signing-db

      - name: Validar recuperación de cajero en PostgreSQL
        run: npm run check:recovery-db

      - name: Validar WebAuthn en PostgreSQL
        run: npm run check:webauthn-db

      - name: Probar operaciones MFA simultáneas en una base aislada
        run: npm run check:webauthn-concurrency
